<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Links</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20120%20120%27%3E%3Crect%20width%3D%27120%27%20height%3D%27120%27%20rx%3D%2726%27%20fill%3D%27%23EA002A%27/%3E%3Cg%20transform%3D%27translate%286%2C0%29%27%3E%3Cpath%20d%3D%27M%2083%2036%20A%2037%2037%200%201%200%2083%2084%27%20fill%3D%27none%27%20stroke%3D%27%23FAF8F5%27%20stroke-width%3D%2712%27%20stroke-linecap%3D%27round%27/%3E%3Cg%20fill%3D%27%23F2A900%27%3E%3Cpolygon%20points%3D%2755%2C44%2064%2C49%2064%2C71%2055%2C76%27/%3E%3Cpolygon%20points%3D%2766%2C50.5%2073%2C55%2073%2C65%2066%2C69.5%27/%3E%3Cpolygon%20points%3D%2775%2C56%2082%2C60%2075%2C64%27/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="ch-app-icon-180.png">
<style>
:root{
  --red:#EA002A; --red2:#ff4a52; --acc:#EA002A;
  --bg:#1A1A1A; --panel:rgba(34,34,34,.6); --line:#2b2b2b; --line2:#3a3a3a;
  --txt:#FAF8F5; --dim:#a6a09b; --faint:#736c72;
  --serif:'Space Grotesk',system-ui,sans-serif;
  --sans:'Space Grotesk',system-ui,-apple-system,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.55;padding:0 18px 60px;min-height:100vh}
body::before{content:'';position:fixed;inset:-20% -10%;pointer-events:none;z-index:0;
  background:
    radial-gradient(46% 30% at 50% 0%, color-mix(in srgb, var(--acc) 24%, transparent), transparent 70%),
    radial-gradient(50% 34% at 65% 100%, color-mix(in srgb, var(--acc) 8%, transparent), transparent 70%);
  animation:aurora 26s ease-in-out infinite alternate}
@keyframes aurora{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:2;text-align:center;padding-top:52px}
.head{width:112px;height:112px;border-radius:50%;object-fit:cover;border:2px solid var(--line2);box-shadow:0 18px 50px -18px rgba(0,0,0,.8);margin-bottom:18px;background:var(--panel)}
.head.ph{display:inline-flex;align-items:center;justify-content:center;font-size:44px}
h1{font-family:var(--serif);font-weight:520;font-size:clamp(30px,8vw,40px);letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--red2)}
.brok{color:var(--dim);font-size:14.5px;margin-top:4px;letter-spacing:.04em}
.blurb{color:var(--dim);font-size:15.5px;margin:14px auto 0;max-width:400px}
.links{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.lbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:16px;color:var(--txt);text-decoration:none;font-weight:600;font-size:16px;padding:16px 18px;transition:transform .14s ease,border-color .14s ease;backdrop-filter:blur(8px)}
.lbtn:hover{transform:translateY(-2px);border-color:color-mix(in srgb, var(--acc) 55%, var(--line2))}
.lbtn.hot{background:linear-gradient(135deg,color-mix(in srgb, var(--acc) 92%, #fff), color-mix(in srgb, var(--acc) 75%, #000) 75%);border-color:transparent;color:#fff;box-shadow:0 14px 34px -12px color-mix(in srgb, var(--acc) 65%, transparent)}
.crow{display:flex;gap:10px;margin-top:2px}
.crow .lbtn{flex:1;padding:13px 10px;font-size:14.5px}
.ig{margin-top:22px;color:var(--dim);font-size:14.5px;text-decoration:none;display:inline-flex;gap:7px;align-items:center}
.ig:hover{color:var(--txt)}
.credit{margin-top:54px;font-size:12.5px;color:var(--faint)}
.credit svg{width:15px;height:15px;vertical-align:-3px;margin-right:3px}
.credit a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line2)}
.credit a:hover{color:var(--txt)}
.center{padding:26vh 0;text-align:center;color:var(--dim)}
@media(prefers-reduced-motion:reduce){body::before{animation:none}}
</style></head><body>
<div class="wrap" id="wrap"><div class="center">Loading…</div></div>
<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyALH9lG_dzg13ooj1brWBifZfAWVcZ3JgtJc617PPLii4kK1igFyU4Gu41Lzwy5gGEiw/exec';
const q = new URLSearchParams(location.search);
const a = q.get('a') || '';
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function fail(msg){ document.getElementById('wrap').innerHTML = '<div class="center">' + esc(msg) + '</div>'; }
function driveImg(id){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w400'; }
function render(hub, kit, bio){
  bio = bio || {}; kit = kit || {};
  const name = hub.agent || 'Agent';
  const brok = hub.brokerage || '';
  document.title = name + (brok ? ' · ' + brok : '') + ' — Links';
  if(kit.c1 && !/^#?f{3,8}$/i.test(kit.c1)) document.documentElement.style.setProperty('--acc', kit.c1);
  let h = '';
  h += kit.head
    ? '<img class="head" src="' + esc(driveImg(kit.head)) + '" alt="' + esc(name) + '" onerror="this.outerHTML=\'<div class=&quot;head ph&quot;>🏡</div>\'">'
    : '<div class="head ph">🏡</div>';
  h += '<h1>' + esc(name).replace(/ ([^ ]+)$/, ' <em>$1</em>') + '</h1>';
  if(brok) h += '<div class="brok">' + esc(brok) + '</div>';
  if(bio.blurb) h += '<div class="blurb">' + esc(bio.blurb) + '</div>';
  h += '<div class="links">';
  (bio.links || []).forEach(function(l, i){
    if(!l || !l.u) return;
    h += '<a class="lbtn biolink' + (i === 0 ? ' hot' : '') + '" data-bl="' + esc(l.t || l.u) + '" href="' + esc(l.u) + '" target="_blank" rel="noopener">' + esc(l.t || l.u) + '</a>';
  });
  const tel = String(bio.phone || '').replace(/[^+0-9]/g, '');
  const contact = [];
  if(tel){ contact.push('<a class="lbtn biolink" data-bl="Call" href="tel:' + esc(tel) + '">📞 Call</a>'); contact.push('<a class="lbtn biolink" data-bl="Text" href="sms:' + esc(tel) + '">💬 Text</a>'); }
  if(hub.email) contact.push('<a class="lbtn biolink" data-bl="Email" href="mailto:' + esc(hub.email) + '">✉️ Email</a>');
  if(contact.length) h += '<div class="crow">' + contact.join('') + '</div>';
  h += '</div>';
  const ig = String(kit.ig || bio.ig || '').replace(/^@/, '');
  if(ig) h += '<a class="ig biolink" data-bl="Instagram" href="https://instagram.com/' + esc(ig) + '" target="_blank" rel="noopener">📸 @' + esc(ig) + '</a>';
  var pageEmpty = !((bio.links || []).length) && !String(bio.blurb || '').trim() && !String(bio.phone || '').trim();
  var stok = ''; try{ stok = localStorage.getItem('rem_admin_token_v1') || ''; }catch(eS){}
  if(pageEmpty && stok){
    h += '<div class="blurb" style="margin-top:28px;border:1px dashed var(--line2);border-radius:14px;padding:14px 16px;font-size:13.5px;text-align:left">🎬 <b>Studio note — only your browsers see this:</b> ' + esc(name) + '\u2019s bio page hasn\u2019t been filled in yet, so visitors only get the contact button' + (kit.head ? '' : ' and a placeholder photo') + '. It fills in from their hub → More → 🔗 link-in-bio (tagline, phone, buttons, headshot) — they can do it, or you can from their hub.</div>';
  }
  h += '<div class="credit"><svg viewBox="0 0 120 120" aria-hidden="true"><path d="M 83 34 A 39 39 0 1 0 83 86" fill="none" stroke="#F2A900" stroke-width="13" stroke-linecap="round"/><g fill="#FAF8F5"><polygon points="55,42 64,48 64,72 55,78"/><polygon points="66,49.3 73,54 73,66 66,70.7"/><polygon points="75,55.3 82,60 75,64.7"/></g></svg>Content by <a href="https://calendly.com/hello-reelestatemedia" target="_blank" rel="noopener">Reel Estate Media</a></div>';
  document.getElementById('wrap').innerHTML = h;
  try{ if(!sessionStorage.getItem('rem_biohit_v:' + a)){ sessionStorage.setItem('rem_biohit_v:' + a, '1'); logHit({t: 'view'}); } }catch(eV){ logHit({t: 'view'}); }
}
function logHit(o){
  try{ fetch(ENDPOINT, {method: 'POST', keepalive: true, body: JSON.stringify({kind: 'biohit', ref: a, project: '', dname: '', who: '', body: JSON.stringify(o)})}); }catch(e){}
}
document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.biolink') : null;
  if(b) logHit({t: 'link', l: b.getAttribute('data-bl') || 'link'});
}, true);
/* 🎬 Studio shortcut: no key in the URL, but this browser holds the admin token?
   Show the agent picker instead of a dead end — one tap opens their live page.
   (Agents and the public still see the key-missing note; each page is per-agent.) */
function studioPicker(tok){
  document.getElementById('wrap').innerHTML = '<div class="center">Loading your agents…</div>';
  fetch(ENDPOINT + '?token=' + encodeURIComponent(tok)).then(function(r){ return r.json(); }).then(function(j){
    if(!j.ok){ fail('This link is missing its key — open it from an agent’s hub, or via 🔗 Bio on your Clients tab.'); return; }
    var hubs = {}, bios = {}, brands = {};   // rows are chronological — newest per ref wins
    (j.rows || []).forEach(function(r){
      var k = String(r.ref);
      if(r.kind === 'hub'){ try{ var m = JSON.parse(String(r.body || '{}')); hubs[k] = String(m.agent || m.n || k); }catch(e){} }
      else if(r.kind === 'bio'){ try{ bios[k] = JSON.parse(String(r.body || '{}')); }catch(e){} }
      else if(r.kind === 'brand'){ try{ brands[k] = JSON.parse(String(r.body || '{}')); }catch(e){} }
    });
    var byName = {};   // agent name -> newest key
    Object.keys(hubs).forEach(function(k){ byName[hubs[k]] = k; });
    var ready = function(k){
      var b = bios[k] || {}, kt = brands[k] || {};
      return !!(((b.links || []).length) || String(b.blurb || '').trim() || String(b.phone || '').trim() || kt.head);
    };
    var names = Object.keys(byName).sort(function(x, y){
      var rx = ready(byName[x]) ? 0 : 1, ry = ready(byName[y]) ? 0 : 1;
      return rx !== ry ? rx - ry : x.localeCompare(y);
    });
    if(!names.length){ fail('No agent pages yet — push a hub from your Command Centre first.'); return; }
    var h = '<div class="head ph">🎬</div><h1>Bio <em>pages</em></h1>' +
      '<div class="brok">Studio view · only you see this list — tap an agent to open their live page</div>' +
      '<div class="links">';
    names.forEach(function(n){
      var ok = ready(byName[n]);
      h += '<a class="lbtn" href="bio.html?a=' + encodeURIComponent(byName[n]) + '" style="justify-content:space-between;text-align:left">' +
        '<span>' + esc(n) + '</span>' +
        '<span style="font-size:12px;font-weight:600;color:' + (ok ? 'var(--dim)' : 'var(--faint)') + '">' + (ok ? '✓ set up' : 'empty') + '</span></a>';
    });
    h += '</div>';
    document.getElementById('wrap').innerHTML = h;
  }).catch(function(){ fail('Couldn’t load the agent list — check your connection and refresh.'); });
}
if(!a){
  var tok = '';
  try{ tok = localStorage.getItem('rem_admin_token_v1') || ''; }catch(eT){}
  if(tok) studioPicker(tok);
  else fail('This link is missing its key — each agent has their own page. Ask us for your personal bio link.');
}
else Promise.all([
  fetch(ENDPOINT + '?hub=' + encodeURIComponent(a)).then(r => r.json()).catch(() => ({})),
  fetch(ENDPOINT + '?brand=' + encodeURIComponent(a)).then(r => r.json()).catch(() => ({})),
  fetch(ENDPOINT + '?bio=' + encodeURIComponent(a)).then(r => r.json()).catch(() => ({}))
]).then(function(rs){
  if(!rs[0].ok || !rs[0].hub){ fail('We couldn’t find this page.'); return; }
  render(rs[0].hub, rs[1] && rs[1].kit, rs[2] && rs[2].bio);
});
</script></body></html>
