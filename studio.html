             Real agents never receive anything from here; the live app's data is never touched.
   /prev/  — the version that was live before the latest update. Same data, older code: the fallback. */
(function(){
  var path = location.pathname, beta = /\/beta\//.test(path), prev = /\/prev\//.test(path);
  if(!beta && !prev) return;
  function ribbon(html, bg){
    var go = function(){

      d.innerHTML = html; document.body.appendChild(d);

  }
  var linkCss = 'color:#fff;text-decoration:underline;margin-left:8px;cursor:pointer';
  var live = path.replace(/\/(beta|prev)\//, '/') + location.search + location.hash;
  if(prev){
    ribbon('⏪ Previous version — same data, older code. <a style="' + linkCss + '" href="' + live.replace(/"/g, '&quot;') + '">Back to the current version →</a>', '#8a5a00');
    return;
  }
  window.__REM_BETA = true;
  var P = 'beta:', SP = Storage.prototype, g = SP.getItem, s = SP.setItem, r = SP.removeItem;

      all.filter(function(x){ return x.indexOf(P) === 0; }).forEach(function(x){ r.call(localStorage, x); });
      all.filter(function(x){ return x.indexOf(P) !== 0 && x.indexOf('rem_') === 0 && x !== 'rem_opout_v1'; })
        .forEach(function(x){ try{ s.call(localStorage, P + x, g.call(localStorage, x)); }catch(e){ window.__REM_BETA_FULL = true; } });
      s.call(localStorage, P + '__seeded', String(Date.now()));
      if(fresh){ try{ history.replaceState(null, '', path + location.search.replace(/[?&]betafresh=1/, '').replace(/^&/, '?') + location.hash); }catch(e){} }
    }
  }catch(e){}
  SP.getItem = function(k){ return g.call(this, P + k); };
  SP.setItem = function(k, v){ return s.call(this, P + k, v); };
  SP.removeItem = function(k){ return r.call(this, P + k); };
  SP.clear = function(){ var ks = [], i, k; for(i = 0; i < this.length; i++){ k = this.key(i); if(k && k.indexOf(P) === 0) ks.push(k); } for(i = 0; i < ks.length; i++) r.call(this, ks[i]); };
  // write guard: only the sandbox agent can receive anything
  var of = window.fetch, okFolders = {}; window.__betaBlocked = 0;
  var isTst = function(v){ return String(v == null ? '' : v).indexOf('tst') === 0; };
  var note = function(){ var n = document.getElementById('rem-stage-n'); if(n) n.textContent = window.__betaBlocked ? ' · ' + window.__betaBlocked + ' send' + (window.__betaBlocked === 1 ? '' : 's') + ' held back' : ''; };
  window.fetch = function(u, o){
    var url = String((u && u.url) || u || ''), m = String((o && o.method) || (u && u.method) || 'GET').toUpperCase();
    if(m === 'GET' || m === 'HEAD') return of.apply(this, arguments);

    if(/script\.google\.com/.test(url)){
      try{ d = JSON.parse(o && o.body); }catch(e){ d = null; }
      if(d) allow = isTst(d.ref) || isTst(d.key) || isTst(d.id) || isTst(d.hub)
        || (d.kind === 'link' && /(^|&)r=tst/.test(String(d.body || '')))
        || (d.kind === 'dlvfolder' && /sandbox/i.test(String(d.agent || '')))
        || !!(d.folder && okFolders[d.folder]);
    }
    if(allow){
      var p = of.apply(this, arguments);
      if(d && d.kind === 'dlvfolder') p.then(function(x){ return x.clone().json(); }).then(function(j){ if(j && j.id) okFolders[j.id] = 1; }).catch(function(){});
      return p;
    }
    window.__betaBlocked++; note();
    return Promise.resolve(new Response(JSON.stringify({ok: true, beta: 1, held: 1}), {status: 200, headers: {'Content-Type': 'application/json'}}));

<script>
/* 🚪 The site's main address is public.
   · The bare address (thecontenthub.ca/) IS the front door: the site's own index.html — on every device.
   · The Command Centre lives at /studio.html (it was /index.html until Nov 2026; that address now forwards a studio
     device here). A browser that has never held studio data is sent to the front door; the Command Centre only opens
     where it already lives, or when asked for explicitly (studio.html?studio=1, or a #setup= link on a new device). */
(function(){
  try{
    if(/\/(beta|prev)\//.test(location.pathname)) return;
    var asked = /#setup=/.test(location.hash) || /[?&]studio(=|&|$)/.test(location.search) || /#dl=/.test(location.hash);
    if(asked) return;
    if(/\/$/.test(location.pathname)){ location.replace('./'); return; }
    var mine = localStorage.getItem('rem_pipeline_v1') || localStorage.getItem('rem_setup_v1') || sessionStorage.getItem('rem_unlocked');
    if(mine) return;
    location.replace('./');
  }catch(e){}
})();
</script>

<style>

  table{width:100%;border-collapse:collapse}

.opts{display:flex;gap:8px;flex-wrap:wrap}

.opts button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.send{display:block;width:100%;background:var(--red);color:#fff;border:none;border-radius:4px;padding:16px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:28px;cursor:pointer}
.alt{display:block;width:100%;background:transparent;color:var(--txt);border:1px solid #6d6d77;border-radius:4px;padding:14px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:10px;cursor:pointer}
#out{display:none;margin-top:14px}
.note{color:var(--dim);font-size:12.5px;margin-top:8px}

<script>
/* ---- theme: light by day (7am-7pm), dark by night, or your pick ---- */
(function(){
  var KEY = 'rem_theme_v1';
  var fab = document.createElement('button');
  fab.id = 'themefab';
  fab.innerHTML = '<span id="themeic"></span><span class="auto">AUTO</span>';
  document.body.appendChild(fab);
  function pref(){ try{ return localStorage.getItem(KEY) || 'auto'; }catch(e){ return 'auto'; } }
  function isDay(){ var h = new Date().getHours(); return h >= 7 && h < 19; }
  function apply(){
    var m = pref();
    var light = m === 'light' || (m === 'auto' && isDay());
    document.body.classList.toggle('light', light);
    fab.classList.toggle('isauto', m === 'auto');
    document.getElementById('themeic').textContent = light ? '\uD83C\uDF19' : '\u2600\uFE0F';
    fab.title = m === 'auto' ? 'Theme: Auto (light by day, dark by night) — tap to pick' : (light ? 'Theme: Light — tap for dark' : 'Theme: Dark — tap for auto');
  }
  fab.addEventListener('click', function(){
    var m = pref();
    var next;
    if(m === 'auto') next = isDay() ? 'dark' : 'light';
    else if(m === 'light') next = 'dark';
    else next = 'auto';
    try{ localStorage.setItem(KEY, next); }catch(e){}
    apply();
  });
  apply();
  setInterval(apply, 10 * 60 * 1000);
})();
</script>

<script>
/* ✨ New-version banner — checks the server for a newer build of this page and offers a one-tap refresh */

  var el = document.getElementById('verstamp'); if(!el) return;
  var cur = (el.textContent || '').trim(); if(!cur) return;
  var path = (location.pathname.split('/').pop() || 'index.html');
