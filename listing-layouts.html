<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Listing Layouts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&family=Gilda+Display&family=Libre+Caslon+Display&family=Marcellus&family=Jost:wght@300;400;500;600;700&family=Roboto:wght@500;700;900&family=Barlow:wght@400;500;600&family=Barlow+Condensed:ital,wght@0,300;0,400;1,300&family=Lato:wght@400;700&family=Open+Sans:wght@400;600&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Manrope:wght@300;400;500;600&display=swap">
<style>
/* Listing Showcase system. A chooser of layouts, each rendered live from one listing's details and photos. Layout CSS uses container queries so thumbnails and the phone preview render true to size. */
:root {
  --surface:#f6f1e8; --surface-raised:#fffaf2; --surface-sunken:#ece4d6;
  --ink:#1f1b16; --ink-muted:#6b6155; --hairline:#d9cfbf; --control-border:#8c8173;
  --accent:#7d5f28; --on-accent:#fffaf2; --accent-soft:#e9dcc2;
  --photo-placeholder:#cfc4b1; --photo-ink:#fffaf2; --photo-scrim:rgba(14,13,11,.62); --focus:#7d5f28;
  --font-display:"Cormorant Garamond","Cormorant",Georgia,serif;
  --font-sans:"DM Sans",system-ui,sans-serif;
  --radius-sm:2px; --radius-md:6px; --radius-pill:999px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --surface:#0e0d0b; --surface-raised:#1a1815; --surface-sunken:#070706; --ink:#f2ece2; --ink-muted:#a89f92; --hairline:#2e2a25; --control-border:#6f675c;
  --accent:#c9a96a; --on-accent:#14110c; --accent-soft:#3a3020; --photo-placeholder:#2a2620; --photo-scrim:rgba(14,13,11,.68); --focus:#c9a96a; color-scheme:dark; } }
:root[data-theme="dark"], :root .t-cin {
  --surface:#0e0d0b; --surface-raised:#1a1815; --surface-sunken:#070706; --ink:#f2ece2; --ink-muted:#a89f92; --hairline:#2e2a25; --control-border:#6f675c;
  --accent:#c9a96a; --on-accent:#14110c; --accent-soft:#3a3020; --photo-placeholder:#2a2620; --photo-scrim:rgba(14,13,11,.68); --focus:#c9a96a; color-scheme:dark; }
:root .t-cream {
  --surface:#f6f1e8; --surface-raised:#fffaf2; --surface-sunken:#ece4d6; --ink:#1f1b16; --ink-muted:#6b6155; --hairline:#d9cfbf; --control-border:#8c8173;
  --accent:#7d5f28; --on-accent:#fffaf2; --accent-soft:#e9dcc2; --photo-placeholder:#cfc4b1; --photo-scrim:rgba(14,13,11,.62); --focus:#7d5f28; color-scheme:light; }

*, *::before, *::after { box-sizing:border-box; }
body { background:var(--surface); color:var(--ink); font:400 16px/26px var(--font-sans); }
:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
p { margin:0; }
img { max-width:100%; }
button { font-family:inherit; }
.eyebrow { font:600 12px/16px var(--font-sans); letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; font:500 14px/20px var(--font-sans); letter-spacing:.02em; padding:11px 20px; border-radius:var(--radius-sm); border:1px solid transparent; cursor:pointer; text-decoration:none; background:transparent; color:var(--ink); }
.btn.primary { background:var(--accent); color:var(--on-accent); }
.btn.secondary { border-color:var(--control-border); }
.btn.secondary:hover { background:var(--accent-soft); }
.btn.sm { padding:7px 12px; font-size:13px; line-height:18px; }
.seg { display:inline-flex; border:1px solid var(--control-border); border-radius:var(--radius-sm); overflow:hidden; }
.seg button { font:500 13px/18px var(--font-sans); padding:7px 12px; border:0; background:transparent; color:var(--ink); cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); }
.gut { padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
@media (min-width:760px){ .gut { padding-left:max(32px, env(safe-area-inset-left,0px)); padding-right:max(32px, env(safe-area-inset-right,0px)); } }

/* ---------- chooser ---------- */
.home { max-width:1240px; margin:0 auto; padding-block:56px 72px; }
.home-top { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
.home h1 { font:500 clamp(40px,6vw,64px)/1.02 var(--font-display); margin:12px 0 14px; letter-spacing:-.01em; text-wrap:balance; max-width:780px; }
.home .sub { color:var(--ink-muted); max-width:620px; }
.home-tools { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.content-strip { margin-top:32px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; padding:14px 16px; background:var(--surface-raised); border:1px solid var(--hairline); border-radius:var(--radius-md); }
.content-strip .thumbs { display:flex; gap:6px; flex-wrap:wrap; }
.content-strip .thumbs span { width:44px; height:32px; background:var(--photo-placeholder) center/cover; display:block; }
.content-strip p { font-size:14px; line-height:20px; color:var(--ink-muted); flex:1 1 220px; min-width:0; }
.content-strip p b { color:var(--ink); font-weight:500; }
.cards { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; margin-top:24px; }
@media (max-width:1100px){ .cards { grid-template-columns:1fr 1fr; } .cards > .card:last-child:nth-child(odd) { grid-column:1 / -1; } }
@media (max-width:640px){ .cards { grid-template-columns:1fr; } .cards > .card:last-child:nth-child(odd) { grid-column:auto; } }
.cards.n4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:1100px){ .cards.n4 { grid-template-columns:1fr 1fr; } }
@media (max-width:640px){ .cards.n4 { grid-template-columns:1fr; } }
.tier { margin-top:56px; }
.tier + .tier { margin-top:72px; }
.tier-head { display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; padding-bottom:18px; border-bottom:1px solid var(--hairline); }
.tier-head h2 { font:500 34px/1.1 var(--font-display); margin:0; }
.tier-head p { color:var(--ink-muted); font-size:15px; line-height:22px; margin-top:6px; }
.tier-price { display:flex; align-items:baseline; gap:4px; margin:0 !important; }
.tier-price b { font:600 40px/1 var(--font-display); color:var(--ink); font-variant-numeric:lining-nums; }
.tier-price span { font-size:15px; color:var(--ink-muted); }
.tier-price s { font:500 24px/1 var(--font-display); color:var(--ink-muted); text-decoration-thickness:2px; text-decoration-color:var(--accent); margin-right:10px; font-variant-numeric:lining-nums; }
.pricetag s { color:var(--ink-muted); font-weight:500; text-decoration-color:var(--accent); margin-right:2px; }
.card-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.pricetag { font:600 12px/16px var(--font-sans); letter-spacing:.04em; padding:4px 10px; border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--ink); white-space:nowrap; }
.card { display:flex; flex-direction:column; background:var(--surface-raised); border:1px solid var(--hairline); border-radius:var(--radius-md); overflow:hidden; text-decoration:none; color:inherit; cursor:pointer; text-align:left; padding:0; font:inherit; }
.card:hover .go { text-decoration:underline; text-underline-offset:4px; }
.thumbwrap { position:relative; aspect-ratio:4/3; overflow:hidden; border-bottom:1px solid var(--hairline); background:var(--surface); }
.thumbwrap .stage { position:absolute; top:0; left:0; width:1280px; transform-origin:0 0; pointer-events:none; }
.card-body { padding:20px 22px 22px; display:flex; flex-direction:column; gap:6px; flex:1; }
.card-body .num { font:600 12px/16px var(--font-sans); letter-spacing:.16em; color:var(--ink-muted); text-transform:uppercase; }
.card-body h2 { font:500 30px/34px var(--font-display); margin:0; }
.card-body p { color:var(--ink-muted); font-size:15px; line-height:23px; }
.card-body .best { font-size:13px; line-height:19px; }
.card-body .best b { color:var(--ink); font-weight:500; }
.go { margin-top:auto; padding-top:12px; font:500 14px/20px var(--font-sans); color:var(--accent); }

/* ---------- viewer ---------- */
.tool { position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--surface); border-bottom:1px solid var(--hairline); }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:41; background:var(--surface); }
.tool-in { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:10px; flex-wrap:wrap; }
.tool .left { display:flex; align-items:center; gap:14px; min-width:0; flex-wrap:wrap; }
.tool .name { font:500 22px/26px var(--font-display); white-space:nowrap; }
.tool .right { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.tool .nav { display:flex; gap:6px; }
.frame { background:var(--surface-sunken); }
.frame.phone { padding-block:24px 48px; }
.frame.phone .stage { width:390px; max-width:100%; margin:0 auto; border:1px solid var(--hairline); box-shadow:0 0 0 8px var(--surface-raised); border-radius:4px; overflow:clip; }
.stage { container-type:inline-size; container-name:stage; background:var(--surface); color:var(--ink); }

/* ---------- drawer ---------- */
.scrimbg { position:fixed; inset:0; background:rgba(14,13,11,.45); z-index:60; }
.drawer { position:fixed; top:0; right:0; bottom:0; width:min(460px,100%); z-index:61; background:var(--surface-raised); border-left:1px solid var(--hairline); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px); }
.drawer header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--hairline); }
.drawer header h2 { font:500 26px/30px var(--font-display); margin:0; }
.drawer .body { overflow-y:auto; padding:20px; display:grid; gap:22px; }
.drawer fieldset { border:0; margin:0; padding:0; display:grid; gap:10px; min-width:0; }
.drawer legend { font:600 12px/16px var(--font-sans); letter-spacing:.16em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; padding:0; }
.drawer label { display:block; font:500 13px/18px var(--font-sans); }
.drawer label > span { display:block; margin-bottom:4px; }
.drawer .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.drawer .three { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.in { width:100%; font:400 15px/22px var(--font-sans); color:var(--ink); background:var(--surface); border:1px solid var(--control-border); border-radius:var(--radius-sm); padding:8px 10px; }
textarea.in { resize:vertical; min-height:84px; }
.hint { font-size:12px; line-height:18px; color:var(--ink-muted); }
.drop { border:1px dashed var(--control-border); border-radius:var(--radius-md); padding:18px; text-align:center; font-size:14px; line-height:20px; color:var(--ink-muted); }
.drop.over { background:var(--accent-soft); }
.drop label { display:inline; color:var(--accent); font-weight:500; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.drop input { position:absolute; opacity:0; width:1px; height:1px; }
.plist { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.pitem { position:relative; aspect-ratio:1; background:var(--photo-placeholder) center/cover; border:0; padding:0; cursor:pointer; }
.pitem.hero { outline:2px solid var(--accent); outline-offset:2px; }
.pitem .tag { position:absolute; left:4px; top:4px; font:600 10px/14px var(--font-sans); letter-spacing:.1em; text-transform:uppercase; background:var(--accent); color:var(--on-accent); padding:1px 5px; }
.pitem .x { position:absolute; right:3px; top:3px; width:22px; height:22px; border-radius:var(--radius-pill); border:0; background:var(--photo-scrim); color:var(--photo-ink); font:500 14px/22px var(--font-sans); cursor:pointer; }
.drawer footer { padding:14px 20px; border-top:1px solid var(--hairline); display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; }

/* ================= shared layout atoms ================= */
.stage .ph { position:relative; overflow:hidden; background:var(--photo-placeholder); margin:0; }
.stage .ph > img, .stage .ph > svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.stage .badge { display:inline-block; font:600 12px/16px var(--font-sans); letter-spacing:.16em; text-transform:uppercase; padding:4px 8px; border-radius:var(--radius-sm); background:var(--accent); color:var(--on-accent); }
.stage .play { position:relative; width:72px; height:72px; border-radius:var(--radius-pill); border:2px solid var(--photo-ink); display:flex; align-items:center; justify-content:center; text-decoration:none; }
.stage .play svg { width:24px; height:24px; fill:var(--photo-ink); margin-left:4px; }
.stage .rq { display:grid; gap:10px; }
.stage .rq .in { background:var(--surface); }
.stage .rq-msg { font:400 12px/18px var(--font-sans); color:var(--ink-muted); }
.stage .fine { font:400 12px/18px var(--font-sans); color:var(--ink-muted); }
.stage h1, .stage h2, .stage h3 { text-wrap:balance; }

/* ================= Layout 1: Showcase ================= */
.sc .wrap { max-width:1120px; margin:0 auto; padding:0 32px; }
.sc .hero { position:relative; height:640px; display:flex; align-items:flex-end; color:var(--photo-ink); overflow:hidden; }
.sc .hero .ph { position:absolute; inset:0; }
.sc .hero .scrim { position:absolute; left:0; right:0; bottom:0; height:80%; background:linear-gradient(to top, var(--photo-scrim) 55%, transparent); }
.sc .hero .wrap { position:relative; width:100%; padding-bottom:64px; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; }
.sc .hero h1 { font:500 72px/1 var(--font-display); letter-spacing:-.01em; margin:12px 0 8px; }
.sc .hero .city { font:400 18px/28px var(--font-sans); }
.sc .hero .price { font:600 40px/44px var(--font-display); }
.sc .specs { position:relative; z-index:2; margin-top:-32px; display:grid; grid-template-columns:repeat(5,1fr); background:var(--surface-raised); border:1px solid var(--hairline); border-radius:var(--radius-md); }
.sc .spec { padding:24px; border-left:1px solid var(--hairline); min-width:0; }
.sc .spec:first-child { border-left:0; }
.sc .spec b { display:block; font:600 28px/34px var(--font-display); }
.sc .spec span { font:500 14px/20px var(--font-sans); color:var(--ink-muted); }
.sc section { padding:96px 0; }
.sc .sunken { background:var(--surface-sunken); }
.sc h2 { font:500 48px/1.08 var(--font-display); margin:12px 0 48px; }
.sc .intro { display:grid; grid-template-columns:1fr 1.4fr; gap:48px; }
.sc .intro h2 { margin-bottom:0; }
.sc .lede { font-size:18px; line-height:28px; }
.sc .intro p + p { margin-top:16px; color:var(--ink-muted); }
.sc .gal { display:grid; grid-template-columns:2fr 1fr 1fr; grid-template-rows:240px 240px; gap:8px; }
.sc .gal .ph:first-child { grid-row:1/3; }
.sc .gal-more { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:8px; }
.sc .gal-more .ph { aspect-ratio:3/2; }
.sc .video { position:relative; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
.sc .video .ph { position:absolute; inset:0; }
.sc .video .vs { position:absolute; inset:0; background:var(--photo-scrim); }
.sc .features { display:grid; grid-template-columns:repeat(3,1fr); gap:0 32px; list-style:none; margin:0; padding:0; }
.sc .features li { padding:16px 0; border-top:1px solid var(--hairline); }
.sc .features b { display:block; font:500 14px/20px var(--font-sans); }
.sc .features span { color:var(--ink-muted); }
.sc .contact { display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start; }
.sc .agent { background:var(--surface-raised); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:24px; display:grid; grid-template-columns:96px 1fr; gap:20px; align-items:center; }
.sc .agent .ph { width:96px; height:96px; }
.sc .agent b { display:block; font:500 28px/34px var(--font-display); }
.sc .agent span { color:var(--ink-muted); font-size:14px; line-height:20px; }
.sc .agent .lines { grid-column:1/-1; font:500 14px/20px var(--font-sans); }
.sc .oh { margin-top:20px; font:500 14px/20px var(--font-sans); padding:12px 14px; background:var(--accent-soft); border-radius:var(--radius-sm); }
.sc form { background:var(--surface-raised); border:1px solid var(--hairline); border-radius:var(--radius-md); padding:32px; }
.sc footer { border-top:1px solid var(--hairline); padding:32px 0; }
@container stage (max-width:760px){
  .sc .wrap { padding:0 16px; }
  .sc .hero { height:520px; } .sc .hero h1 { font-size:44px; } .sc .hero .wrap { padding-bottom:48px; }
  .sc .specs { grid-template-columns:1fr 1fr; } .sc .spec { border-left:0; border-top:1px solid var(--hairline); } .sc .spec:nth-child(-n+2){ border-top:0; } .sc .spec:nth-child(even){ border-left:1px solid var(--hairline); } .sc .spec:last-child:nth-child(odd){ grid-column:1/-1; }
  .sc section { padding:64px 0; } .sc h2 { font-size:36px; margin-bottom:32px; }
  .sc .intro, .sc .contact { grid-template-columns:1fr; gap:24px; }
  .sc .gal { grid-template-columns:1fr 1fr; grid-template-rows:220px 130px 130px; } .sc .gal .ph:first-child { grid-column:1/-1; grid-row:auto; }
  .sc .gal-more { grid-template-columns:1fr 1fr; }
  .sc .features { grid-template-columns:1fr; }
  .sc form { padding:24px; }
}

/* ================= Layout 2: Split gallery ================= */
.sp { display:grid; grid-template-columns:minmax(360px,5fr) 7fr; align-items:start; }
.sp .panel { position:sticky; top:var(--stick, 0px); max-height:calc(100vh - var(--stick, 0px)); overflow-y:auto; border-right:1px solid var(--hairline); padding:40px; display:flex; flex-direction:column; gap:26px; }
.thumbwrap .sp .panel { position:static; max-height:none; }
.sp .status { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font:500 13px/18px var(--font-sans); color:var(--ink-muted); }
.sp h1 { font:500 56px/1 var(--font-display); letter-spacing:-.01em; margin:0; }
.sp .city { margin-top:8px; font-size:18px; line-height:28px; color:var(--ink-muted); }
.sp .price { font:600 44px/1 var(--font-display); }
.sp .price em { font:italic 500 18px/1 var(--font-display); color:var(--ink-muted); margin-left:8px; }
.sp dl { display:grid; grid-template-columns:1fr 1fr; margin:0; border-top:1px solid var(--hairline); }
.sp dl div { padding:12px 0; border-bottom:1px solid var(--hairline); display:flex; justify-content:space-between; gap:12px; min-width:0; }
.sp dl div:nth-child(odd) { padding-right:16px; border-right:1px solid var(--hairline); }
.sp dl div:nth-child(even) { padding-left:16px; }
.sp dt { font:500 14px/20px var(--font-sans); color:var(--ink-muted); }
.sp dd { margin:0; font:600 20px/20px var(--font-display); text-align:right; }
.sp .oh { font:500 14px/20px var(--font-sans); padding:12px 14px; background:var(--accent-soft); border-radius:var(--radius-sm); }
.sp .agent { display:grid; grid-template-columns:64px 1fr; gap:16px; align-items:center; }
.sp .agent .ph { width:64px; height:64px; border-radius:var(--radius-pill); }
.sp .agent b { display:block; font:500 24px/28px var(--font-display); }
.sp .agent span { font-size:13px; line-height:18px; color:var(--ink-muted); }
.sp .agent .lines { grid-column:1/-1; font:500 14px/20px var(--font-sans); }
.sp .flow { min-width:0; }
.sp .stack { display:grid; gap:8px; padding:8px; }
.sp .r32 { aspect-ratio:3/2; } .sp .r45 { aspect-ratio:4/5; }
.sp .pair { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.sp .chapter { padding:72px 56px; display:grid; grid-template-columns:120px minmax(0,1fr); gap:24px; }
.sp .chapter h2 { font:500 44px/1.08 var(--font-display); margin:0 0 16px; }
.sp .chapter h2 em { font-style:italic; color:var(--accent); }
.sp .chapter p { max-width:600px; color:var(--ink-muted); }
.sp .chapter p.lede { color:var(--ink); font-size:18px; line-height:28px; margin-bottom:12px; }
.sp .hl { list-style:none; margin:24px 0 0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:0 32px; max-width:640px; }
.sp .hl li { padding:10px 0; border-top:1px solid var(--hairline); font-size:15px; line-height:22px; }
.sp .hl b { font-weight:500; display:block; } .sp .hl span { color:var(--ink-muted); }
.sp .film { position:relative; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; }
.sp .film .ph { position:absolute; inset:0; } .sp .film .vs { position:absolute; inset:0; background:var(--photo-scrim); }

.md { --md-bg:#ffffff; --md-band:#f6f5f2; --md-chip:#efede8; --md-ink:#141414; --md-muted:#5f5f5f; --md-hair:#e3e1dc; --md-card:#ffffff; --md-acc:var(--pick-accent,#7d5f28); --md-sans:"Jost", "Futura", "Century Gothic", system-ui, sans-serif; --md-body:"Open Sans", system-ui, sans-serif;

}

  function makeBrochurePdf(m, downloads, btn){
    var st=m.querySelector('[data-bro-status]');
    btn.disabled=true; st.textContent='Building the PDF…';
    var libs = (window.html2canvas && window.jspdf) ? Promise.resolve() :
      loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js').then(function(){ return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'); });
    libs.then(function(){
      var holder=document.createElement('div');
      var land=(BRO_KIND!=='meridian'&&BRO_KIND!=='linden'&&BRO_KIND!=='westbrook'), pw=land?1056:816;
      holder.style.cssText='position:fixed;left:0;top:0;width:'+pw+'px;z-index:-1;pointer-events:none;';
      holder.innerHTML=broPagesFor(BRO_KIND); app.appendChild(holder);
      var pages=[].slice.call(holder.querySelectorAll('[data-bro-page]'));

      var pdf=new window.jspdf.jsPDF({ unit:'pt', format:'letter', orientation:land?'landscape':'portrait' });
      return pages.reduce(function(chain, pg, i){
        return chain.then(function(){
          return window.html2canvas(pg, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, scrollX:0, scrollY:0, windowWidth:pw }).then(function(c){
            if (i>0) pdf.addPage('letter', land?'landscape':'portrait');

        holder.remove();
        var name=(String(L.address||'listing').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') || 'listing')+'-brochure.pdf';
        if (downloads) return downloads.save({ filename:name, data: pdf.output('blob') });
        var a=document.createElement('a'); a.href=URL.createObjectURL(pdf.output('blob')); a.download=name; document.body.appendChild(a); a.click();
        setTimeout(function(){ try{ URL.revokeObjectURL(a.href); a.remove(); }catch(e){} }, 4000);
      });
    }).then(function(){ st.textContent='Saved.'; }).catch(function(e){
      st.textContent = (e && e.code==='declined') ? 'Download cancelled.' : 'The PDF could not be made here. You can still screenshot the pages.';
    }).then(function(){ btn.disabled=false; });

    { id:'slate', name:'Slate', cream:'#4a5560', dark:'#a9b4bf' }
  ];
  function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(function(c){return c+c;}).join(''); return [0,2,4].map(function(i){return parseInt(h.slice(i,i+2),16);}); }
  function rgbHex(c){ return '#'+c.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }).join(''); }
  function lum(c){ return c.map(function(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }).reduce(function(a,v,i){ return a+v*[0.2126,0.7152,0.0722][i]; },0); }
  function contrast(a,b){ var x=lum(a), y=lum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
  function mix(a,b,t){ return a.map(function(v,i){ return v+(b[i]-v)*t; }); }
  function fitAccent(hex){
    var c=hexRgb(hex), cream=c, dark=c, i;
    for(i=0;i<20 && contrast(cream,[241,236,227])<4.8;i++) cream=mix(cream,[0,0,0],0.08);
    for(i=0;i<20 && contrast(dark,[26,27,26])<5.5;i++) dark=mix(dark,[255,255,255],0.08);
    return { id:hex, name:'Custom', cream:rgbHex(cream), dark:rgbHex(dark) };
  }

  function drawerHTML(){
    function f(k,label,ph,type){ return '<label><span>'+label+'</span><input class="in" data-k="'+k+'" value="'+esc(L[k])+'" placeholder="'+esc(ph||'')+'"'+(type?' type="'+type+'"':'')+'></label>'; }
    function ta(k,label,rows){ return '<label><span>'+label+'</span><textarea class="in" data-k="'+k+'" rows="'+(rows||4)+'">'+esc(L[k])+'</textarea></label>'; }
    var pl = photos.map(function(p,i){ return '<div style="position:relative"><button type="button" class="pitem'+(i===0?' hero':'')+'" data-hero="'+i+'" style="background-image:url('+p.url+')" aria-label="'+(i===0?'Hero photo':'Make this the hero photo')+'">'+(i===0?'<span class="tag">Hero</span>':'')+'</button><button type="button" class="x" data-rm="'+i+'" aria-label="Remove photo">×</button></div>'; }).join('');
    return '<div class="scrimbg" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Listing details">'+
      '<header><h2>Listing details</h2><button class="btn secondary sm" type="button" data-close>Done</button></header><div class="body">'+
      '<fieldset><legend>Photos</legend><div class="drop" id="drop">Drag the delivered photos here or <label for="filepick-in">choose files</label><input type="file" id="filepick-in" accept="image/*" multiple></div>'+
        (photos.length?'<div class="plist">'+pl+'</div><p class="hint">Tap a photo to make it the hero. Photos stay on this device for this visit.</p>':'<p class="hint">Photos stay on this device for this visit; nothing is uploaded.</p>')+'<label><span>Listing film (video file)</span><input class="in" type="file" accept="video/*" id="vidpick"></label><p class="hint">'+(videoFile?'Film added. It plays in the Film section of Residence.':'Or paste a YouTube or Vimeo link under Video link.')+'</p></fieldset>'+
      '<fieldset><legend>Property</legend>'+f('name','Property name (big headline)','Ridgeview House')+f('address','Address','1418 Ridgeview Crescent')+f('city','Neighbourhood, city','Glen Abbey, Oakville')+
        '<div class="two">'+f('price','Price','$1,249,000')+f('status','Status label','Just listed')+'</div>'+
        '<div class="three">'+f('beds','Beds')+f('baths','Baths')+f('sqft','Sq ft')+'</div><div class="three">'+f('lot','Lot')+f('parking','Parking')+f('built','Year built')+'</div>'+
        f('mls','MLS® number')+ta('openHouse','Open houses, one per line: Day | time | label (optional)',3)+f('video','Video link','https://…','url')+'<div class="two">'+f('tour','3D tour link','https://…','url')+f('brochure','Brochure link','https://…','url')+'</div></fieldset>'+
      '<fieldset><legend>Story</legend>'+f('headline','Headline')+ta('intro','Opening paragraph',3)+ta('body','More about the home',4)+
        ta('highlights','Highlights, one per line: Name | detail',5)+'</fieldset>'+
      '<fieldset><legend>Agent</legend><div class="two">'+f('agentName','Name')+f('agentTitle','Title')+'</div>'+f('brokerage','Brokerage')+
        '<div class="two">'+f('phone','Phone')+f('email','Email','','email')+'</div>'+'<div class="two">'+f('website','Website','www.yoursite.com')+f('license','Licence / registration #')+'</div>'+
        '<label><span>Headshot</span><input class="in" type="file" accept="image/*" id="headpick"></label></fieldset>'+
      '</div><footer><button class="btn secondary sm" type="button" data-reset>Reset to sample</button><button class="btn primary sm" type="button" data-close>Done</button></footer></aside>';
  }

  function fitThumbs(){
    document.querySelectorAll('[data-thumb]').forEach(function(w){ var st=w.querySelector('.stage'); st.style.transform='scale('+(w.clientWidth/1280)+')'; });
  }
  function setStick(){ var t=document.querySelector('.tool'); var st=document.getElementById('stage'); if(t&&st) st.style.setProperty('--stick', t.offsetHeight+'px'); }
  var lastRoute=null;
  function render(keepScroll){
    applyTheme();
    var r=route(), y=window.scrollY;
    app.innerHTML = (r==='home'?homeView():layoutView(r)) + (ui.drawer?drawerHTML():'');
    if (r!==lastRoute){ window.scrollTo(0,0); lastRoute=r; } else if (keepScroll) window.scrollTo(0,y);
    fitThumbs(); setStick(); wire(); wireRs();
  }
  function refreshStage(){ // live update without rebuilding the drawer
    var r=route();
    if (r==='home'){ var y=window.scrollY; var tmp=document.createElement('div'); tmp.innerHTML=homeView(); var home=app.querySelector('.home'); home.replaceWith(tmp.firstChild); window.scrollTo(0,y); fitThumbs(); wireViews(); }
    else { var st=document.getElementById('stage'); if(st){ st.innerHTML=RENDER[r](); wireForms(); wireRs(); } }
  }
  function addFiles(list){
    Array.prototype.forEach.call(list||[], function(f){ if(/^image\//.test(f.type)) photos.push({url:URL.createObjectURL(f), name:f.name}); });
    render(true);
  }
  function wireForms(){
    app.querySelectorAll('[data-rq]').forEach(function(f){ f.addEventListener('submit',function(e){ e.preventDefault(); var m=f.querySelector('.rq-msg'); m.textContent='Preview only: on the live page this request goes to '+(L.agentName||'the agent')+'.'; }); });
  }
  function wireViews(){
    app.querySelectorAll('[data-theme-set]').forEach(function(b){ b.onclick=function(){ ui.theme=b.getAttribute('data-theme-set'); save(); render(true); }; });
    app.querySelectorAll('[data-accent]').forEach(function(b){ b.onclick=function(){ L.accent=b.getAttribute('data-accent'); save(); render(true); var d=app.querySelector('.accpick'); if(d) d.open=true; }; });
    app.querySelectorAll('[data-accent-custom]').forEach(function(inp){ inp.addEventListener('input',function(){ L.accent=inp.value; save(); applyAccent(); var d=inp.closest('.accpick'), a=currentAccent(); if(d){ d.querySelector('.dot').style.background=ui.theme==='cin'?a.dark:a.cream; d.querySelector('.accname').textContent='Custom'; d.querySelectorAll('[data-accent]').forEach(function(x){ x.setAttribute('aria-pressed','false'); }); } }); inp.addEventListener('change',function(){ render(true); var d=app.querySelector('.accpick'); if(d) d.open=true; }); });
    app.querySelectorAll('[data-device]').forEach(function(b){ b.onclick=function(){ ui.device=b.getAttribute('data-device'); render(true); }; });
    app.querySelectorAll('[data-open-drawer]').forEach(function(b){ b.onclick=function(){ ui.drawer=true; render(true); var d=app.querySelector('.drawer input'); if(d) d.focus(); }; });
    app.querySelectorAll('[data-pick]').forEach(function(b){ b.onclick=function(){ document.getElementById('filepick').click(); }; });
    wireForms();
  }
  function wire(){
    wireViews();
    app.querySelectorAll('[data-close]').forEach(function(b){ b.onclick=function(){ ui.drawer=false; render(true); }; });
    app.querySelectorAll('[data-k]').forEach(function(inp){ inp.addEventListener('input',function(){ L[inp.getAttribute('data-k')]=inp.value; save(); refreshStage(); }); });
    var r=app.querySelector('[data-reset]'); if(r) r.onclick=function(){ L=Object.assign({},SAMPLE); photos=[]; headshot=null; videoFile=null; save(); render(true); };
    app.querySelectorAll('[data-hero]').forEach(function(b){ b.onclick=function(){ var i=+b.getAttribute('data-hero'); if(i>0){ var p=photos.splice(i,1)[0]; photos.unshift(p); render(true);} }; });
    app.querySelectorAll('[data-rm]').forEach(function(b){ b.onclick=function(){ photos.splice(+b.getAttribute('data-rm'),1); render(true); }; });
    var fi=document.getElementById('filepick-in'); if(fi) fi.onchange=function(){ addFiles(fi.files); };
    var vp=document.getElementById('vidpick'); if(vp) vp.onchange=function(){ var f=vp.files[0]; if(f){ videoFile=URL.createObjectURL(f); render(true); } };
    var hp=document.getElementById('headpick'); if(hp) hp.onchange=function(){ var f=hp.files[0]; if(f){ headshot=URL.createObjectURL(f); refreshStage(); } };
    var drop=document.getElementById('drop');
    if(drop){ drop.addEventListener('dragover',function(e){e.preventDefault(); drop.classList.add('over');}); drop.addEventListener('dragleave',function(){drop.classList.remove('over');}); drop.addEventListener('drop',function(e){ e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); }); }
  }
  document.getElementById('filepick').onchange=function(){ addFiles(this.files); this.value=''; };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.getElementById('bro')){ closeBrochure(); return; } if(document.getElementById('rsall')){ if(e.key==='Escape'){ closeAll(); return; } if(LB.mode==='photo'&&e.key==='ArrowRight'){ lbGo(1); return; } if(LB.mode==='photo'&&e.key==='ArrowLeft'){ lbGo(-1); return; } } if(e.key==='Escape'&&document.getElementById('rsmenu')){ closeRsMenu(); return; } if(e.key==='Escape'&&ui.drawer){ ui.drawer=false; render(true); } });
  window.addEventListener('hashchange',function(){ render(false); });
  window.addEventListener('resize',function(){ fitThumbs(); setStick(); var t=rsTrack(); if(t&&rsHorizontal(t)){ var i=rsIndex(t); t.scrollLeft=rsPages(t)[i].offsetLeft; } });
  render(false);
  /* ---- Reel Estate Media bridge: pull the delivered photos + brochure release state ---- */
  (function remBridge(){
    if(R_PH && R_GKEY){
      var ids=[]; String(R_PH).split(',').forEach(function(u){ var m2=u.match(/\/drive\/(?:u\/\d+\/)?folders\/([^\/?#]+)/); if(m2) ids.push(m2[1]); });
      ids.forEach(function(fid){
        fetch('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent("'"+fid+"' in parents and mimeType contains 'image/' and trashed=false")+'&key='+R_GKEY+'&fields=files(id,name)&orderBy=name&pageSize=200')
          .then(function(x){ return x.json(); })
          .then(function(j){
            var fl=(j.files||[]).sort(function(a,b){ return a.name.localeCompare(b.name, undefined, {numeric:true, sensitivity:'base'}); });
            if(!fl.length) return;
            fl.forEach(function(f){ photos.push({url:'https://drive.google.com/thumbnail?id='+f.id+'&sz=w2400', name:f.name.replace(/\.[a-z0-9]+$/i,'')}); });
            render(true);
          }).catch(function(){});
      });
    }
    if(R_ENDPOINT && R_REF){
      fetch(R_ENDPOINT+'?thread='+encodeURIComponent(R_REF)).then(function(x){ return x.json(); }).then(function(j){
        if((j.rows||[]).some(function(m3){ return m3.from==='jag' && String(m3.body||'').indexOf('[[BRO-OK]]')===0; })) broReleased=true;
      }).catch(function(){});
    }
  })();
})();
</script>
